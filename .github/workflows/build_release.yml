name: Build and publish app release

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: diary

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    name: "Release: build the app and attach it to a GitHub release"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_NAME }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd,mbstring,xml,zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_NAME }}/package-lock.json

      - name: Check that tag and app version match
        working-directory: ${{ env.APP_NAME }}
        run: |
          app_version=$(sed -n 's|.*<version>\(.*\)</version>.*|\1|p' appinfo/info.xml)
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${app_version} in appinfo/info.xml"
            exit 1
          fi

      - name: Install PHP dependencies
        working-directory: ${{ env.APP_NAME }}
        run: composer install --no-dev --prefer-dist --optimize-autoloader --classmap-authoritative --no-interaction

      - name: Build frontend
        working-directory: ${{ env.APP_NAME }}
        run: |
          npm ci
          npm run build

      - name: Create release archive
        run: |
          archive="${APP_NAME}-${GITHUB_REF_NAME#v}.tar.gz"
          tar czf "$archive" --owner=0 --group=0 --exclude-vcs \
            --exclude="${APP_NAME}/node_modules" \
            --exclude="${APP_NAME}/tests" \
            --exclude="${APP_NAME}/tools" \
            --exclude="${APP_NAME}/screenshots" \
            --exclude="${APP_NAME}/src" \
            --exclude="${APP_NAME}/Makefile" \
            --exclude="${APP_NAME}/phpunit*.xml" \
            --exclude="${APP_NAME}/composer.*" \
            --exclude="${APP_NAME}/package*.json" \
            --exclude="${APP_NAME}/*.config.js" \
            --exclude="${APP_NAME}/js/*.map" \
            --exclude="${APP_NAME}/.*" \
            "${APP_NAME}"
          sha256sum "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" "${ARCHIVE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${APP_NAME}/RELEASE.md" \
            --verify-tag
